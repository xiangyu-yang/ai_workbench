# 生产参考清单：外部 PostgreSQL + 共享对象存储/卷 + Web/Worker 分离
# 1) 创建命名空间与密钥：kubectl -n cuter create secret generic cuter-secrets \
#      --from-literal=APP_SECRET="$(openssl rand -hex 32)" \
#      --from-literal=DATABASE_URL="postgres://cuter:***@pg.internal:5432/cuter"
# 2) 按需调整镜像、Ingress 域名与资源配额
apiVersion: v1
kind: Namespace
metadata:
  name: cuter
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cuter-data
  namespace: cuter
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuter-web
  namespace: cuter
spec:
  replicas: 2
  selector:
    matchLabels: { app: cuter-web }
  template:
    metadata:
      labels: { app: cuter-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: web
          image: registry.example.com/cuter-workbench:1.0.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef: { name: cuter-secrets }
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: /data
            - name: INPROCESS_WORKER
              value: "false"
            - name: MIGRATE_ON_BOOT
              value: "false"
            - name: MCP_ALLOW_STDIO
              value: "false"
            - name: SKILL_ALLOW_SCRIPTS
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: cuter-data }
---
apiVersion: v1
kind: Service
metadata:
  name: cuter-web
  namespace: cuter
spec:
  selector: { app: cuter-web }
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuter-worker
  namespace: cuter
spec:
  replicas: 2
  selector:
    matchLabels: { app: cuter-worker }
  template:
    metadata:
      labels: { app: cuter-worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: registry.example.com/cuter-workbench-worker:1.0.0
          command: ["npx", "tsx", "src/worker/index.ts"]
          envFrom:
            - secretRef: { name: cuter-secrets }
          env:
            - name: NODE_ENV
              value: production
            - name: DATA_DIR
              value: /data
            - name: TASK_CONCURRENCY
              value: "4"
            - name: MIGRATE_ON_BOOT
              value: "false"
            - name: MCP_ALLOW_STDIO
              value: "false"
            - name: SKILL_ALLOW_SCRIPTS
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: cuter-data }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cuter-web
  namespace: cuter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cuter-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cuter
  namespace: cuter
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [cuter.example.com]
      secretName: cuter-tls
  rules:
    - host: cuter.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cuter-web
                port:
                  number: 80
