# 生产对象存储 overlay：MinIO + Web/Worker S3 配置。
#
# 用法：
#   APP_SECRET=$(openssl rand -hex 32) \
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.s3.yml up -d --build
#
# 使用外部 S3 时不要启动 minio，直接把 S3_* 环境变量传给 prod compose 即可。
services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-cuter}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-cuter-minio-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    environment:
      S3_BUCKET: ${S3_BUCKET:-cuter}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-cuter}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-cuter-minio-change-me}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      minio:
        condition: service_healthy

  worker:
    environment:
      S3_BUCKET: ${S3_BUCKET:-cuter}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-cuter}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-cuter-minio-change-me}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data:
