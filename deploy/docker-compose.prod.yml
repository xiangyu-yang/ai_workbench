# 生产拓扑：PostgreSQL + Web（可水平扩展） + Worker（独立任务执行）
# 用法：
#   APP_SECRET=$(openssl rand -hex 32) docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cuter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuter-change-me}
      POSTGRES_DB: cuter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuter -d cuter"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      target: worker
    image: cuter-workbench:worker
    command: ["npx", "tsx", "scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgres://cuter:${POSTGRES_PASSWORD:-cuter-change-me}@postgres:5432/cuter
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATA_DIR: /data
      MIGRATE_ON_BOOT: "true"
    volumes:
      - cuter_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      target: web
    image: cuter-workbench:web
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cuter:${POSTGRES_PASSWORD:-cuter-change-me}@postgres:5432/cuter
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      APP_URL: ${APP_URL:-http://localhost:3100}
      DATA_DIR: /data
      MIGRATE_ON_BOOT: "false"
      INPROCESS_WORKER: "false"
      MCP_ALLOW_STDIO: ${MCP_ALLOW_STDIO:-false}
      SKILL_ALLOW_SCRIPTS: ${SKILL_ALLOW_SCRIPTS:-false}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - cuter_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      target: worker
    image: cuter-workbench:worker
    restart: unless-stopped
    command: ["npx", "tsx", "src/worker/index.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cuter:${POSTGRES_PASSWORD:-cuter-change-me}@postgres:5432/cuter
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATA_DIR: /data
      MIGRATE_ON_BOOT: "false"
      TASK_CONCURRENCY: ${TASK_CONCURRENCY:-4}
      MCP_ALLOW_STDIO: ${MCP_ALLOW_STDIO:-false}
      SKILL_ALLOW_SCRIPTS: ${SKILL_ALLOW_SCRIPTS:-false}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - cuter_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  cuter_data:
