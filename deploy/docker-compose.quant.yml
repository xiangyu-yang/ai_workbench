# 可选量化服务：独立 Python FastAPI，不替代主控制面。
# 用法：
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.quant.yml up -d --build
services:
  quant:
    build:
      context: ../services/quant
    image: cuter-quant:0.1.0
    restart: unless-stopped
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
